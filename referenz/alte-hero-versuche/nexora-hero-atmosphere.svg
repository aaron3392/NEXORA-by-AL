 <filter id="cityGlow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="planet"><path d="M-120 690 Q960 250 2040 690 L2040 1200 L-120 1200Z"/></clipPath>
</defs>
