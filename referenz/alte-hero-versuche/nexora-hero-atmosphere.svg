 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0ff"/><stop offset=".16" stop-color="#ed9cff"/><stop offset=".38" stop-color="#9b28ff"/><stop offset="1" stop-color="#3a0873" stop-opacity="0"/></linearGradient>
